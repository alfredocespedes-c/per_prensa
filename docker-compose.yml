# Stack de producción: app (React servido por nginx, que proxea /api al backend),
# backend (FastAPI) y collector (Node, con su propio cron horario interno). La base
# de datos NO está aquí: es el servidor Postgres 17 compartido (ver .env.example)
# administrado aparte — este compose solo se conecta a él.
#
# Solo "app" necesita ser alcanzable desde afuera de Docker: nginx (dentro de ese
# contenedor) le habla a `backend` por la red interna de Docker
# (http://backend:8000), así que el backend NO publica ningún puerto al host —
# menos superficie expuesta, sin perder nada de funcionalidad. El servidor ya tiene
# un reverse proxy propio (nginx/traefik/etc.) que debe apuntar al puerto interno
# definido por APP_PORT (ver .env).
#
# Uso: docker compose --env-file .env up --build -d
# Desarrollo local (sin tocar el servidor Postgres compartido):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    # conaf.cl usa DNS de horizonte partido: desde el contenedor, iam.conaf.cl resuelve
    # a su IP PÚBLICA y este servidor no tiene salida a internet, así que cada callback
    # de login daría ConnectTimeout de 10 s. Se fija el nombre a la IP interna. Sigue
    # siendo HTTPS con SNI iam.conaf.cl, o sea que el certificado valida igual.
    # Solo el backend lo necesita: el collector no habla con el IAM.
    # Sin `:-default`: si IAM_IP no está en .env, mejor que compose falle ruidoso a que
    # se cuele una IP de plantilla (el repo es público, ver SEGURIDAD.md SEC-09).
    extra_hosts:
      - "iam.conaf.cl:${IAM_IP}"
    # Sin `ports:` a propósito — ver nota arriba. Para depurar puntualmente contra
    # este contenedor desde el host: `docker compose exec backend curl localhost:8000/health`
    # o agregar temporalmente `ports: ["8000:8000"]` mientras se investiga.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    env_file: .env
    volumes:
      # Estado de trabajo del collector (dedup, cachés de Google News/sitemap) —
      # debe persistir entre reinicios del contenedor. Ver
      # collector/src/adaptadores/repositorio-json.js.
      - collector_datos:/app/collector/datos
    restart: unless-stopped
    # Sin depends_on: el collector solo habla con Postgres (externo, siempre
    # activo), no con el backend — una dependencia ahí sería artificial.

  # Lee el buzón de Gmail y registra el ENLACE del boletín del servicio contratado
  # (Simbiu MediaStation) en la tabla `boletines_contratados`. Reemplaza al pegado manual
  # que hacía un admin; el panel de /#/configuracion queda como corrección.
  #
  # No publica puertos ni recibe tráfico: solo sale hacia Gmail y escribe en Postgres.
  # No aplica db/schema.sql — eso lo hacen el collector y el backend, y un tercer proceso
  # ejecutando el mismo DDL sería una carrera esperando a ocurrir.
  boletin-correo:
    build:
      # El contexto es la subcarpeta, así que el Dockerfile de gmail-boletin sirve igual
      # standalone (cd gmail-boletin && docker compose up) que desde acá.
      context: ./gmail-boletin
    # Este servicio ESCRIBE en `boletines_contratados` pero NO aplica db/schema.sql —eso
    # lo hace el backend al arrancar—, así que sin esperarlo podría intentar el primer
    # INSERT contra una tabla que todavía no existe. El síntoma sería un error de
    # psycopg2 en el primer despliegue y ninguno después: la clase de fallo que aparece
    # una sola vez y nadie logra reproducir.
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    environment:
      # Revisa cada 30 min entre las 07:00 y las 13:59 de Chile: el boletín llega ~08:00 y
      # SECOM lo mira a las 08:00. Fuera de esa franja no se consulta a Gmail — no tiene
      # sentido gastar cuota de madrugada. Volver a leer el mismo correo es idempotente,
      # así que revisar de más no duplica nada.
      GMAIL_INTERVALO_SEGUNDOS: ${GMAIL_INTERVALO_SEGUNDOS:-1800}
      BOLETIN_HORAS_ACTIVAS: ${BOLETIN_HORAS_ACTIVAS:-7-13}
      # Se leen los últimos correos, no el buzón entero: solo interesa el del día.
      GMAIL_MAX_RESULTADOS: ${GMAIL_MAX_RESULTADOS:-10}
      TZ: ${TZ:-America/Santiago}
    # unless-stopped y NO "no": con GMAIL_INTERVALO_SEGUNDOS > 0 el proceso se queda vivo
    # durmiendo entre revisiones, así que salir es una anomalía y reiniciar es lo correcto.
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BASE_PATH: /
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8000"
    restart: unless-stopped

volumes:
  collector_datos:
