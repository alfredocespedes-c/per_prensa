# Override de desarrollo: agrega un Postgres local desechable para probar todo el
# stack SIN tocar el servidor compartido real (<HOST_BD>). Uso:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up --build
#
# .env.dev debe apuntar DATABASE_HOST=postgres-dev (ver .env.example).
services:
  postgres-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-coipo}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-coipo}
      POSTGRES_DB: ${DATABASE_NAME:-coipo_prensa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-coipo} -d ${DATABASE_NAME:-coipo_prensa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    depends_on:
      postgres-dev:
        condition: service_healthy
    # Solo en dev: en producción el backend no publica puerto (ver docker-compose.yml).
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  collector:
    depends_on:
      postgres-dev:
        condition: service_healthy

volumes:
  postgres_dev_datos:
