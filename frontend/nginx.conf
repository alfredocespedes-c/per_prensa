server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mismo origen que el frontend: evita CORS por completo (ver
    # frontend/src/datos.js, que pide ${BASE_URL}api/noticias).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Retorno del login del IAM. Va al BACKEND, no a la SPA: acá se canjea el código
    # por el token (server-to-server, con el client_secret) y se emite la cookie de
    # sesión. Sin este bloque caería en el try_files de abajo, el navegador recibiría
    # el index.html y el código nunca se canjearía.
    #
    # Se usa la ruta sin prefijo /api porque es con la que están registradas las
    # aplicaciones del ecosistema COIPO en el IAM, que compara la redirect_uri por
    # igualdad exacta. El backend también la expone en /api/auth/callback, así que
    # sirve cualquiera de las dos según lo que diga IAM_REDIRECT_URI.
    #
    # `location =` (match exacto) y no `location /auth/`: no se captura ninguna otra
    # ruta que la SPA pudiera querer usar. nginx conserva la query string
    # (?code=...&state=...) automáticamente.
    location = /auth/callback {
        proxy_pass http://backend:8000/auth/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Datos del collector: NUNCA servirlos como estáticos. Toda noticia sale por
    # /api/noticias, que exige sesión (ver backend/app/main.py). Sin este bloque, un
    # archivo que se cuele en frontend/public/data/ quedaría accesible sin login por
    # el try_files de abajo — pasó con historico.json. Defensa en profundidad: el
    # .dockerignore ya excluye el directorio del build.
    location /data/ {
        return 404;
    }

    # Geometría de las regiones para el mapa coroplético. A diferencia de /data/, esto
    # SÍ es público a propósito: son polígonos administrativos oficiales, no noticias.
    # El nombre lleva versión (regiones-chile.v1.json) porque los archivos de public/
    # no reciben hash de Vite; regenerar la geometría implica pasar a v2, y eso es lo
    # que hace segura la cabecera `immutable`.
    location /geo/ {
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HashRouter (ver frontend/src/App.jsx) nunca pone rutas en el path real, pero
    # el fallback a index.html es una salvaguarda estándar de SPA de todos modos.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
